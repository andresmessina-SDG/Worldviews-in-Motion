<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Worldviews in Motion</title>
<meta name="description" content="An animated watercolor visualizer of the world's major worldviews, beginning with Christian theism and following the questions that lead away from it.">
<meta name="theme-color" content="#f6f1e7">
<!-- what a shared link shows: the page's title, its description and a still of the painting (preview.jpg, 1200 x 630) -->
<meta property="og:type" content="website">
<meta property="og:title" content="Worldviews in Motion">
<meta property="og:description" content="An animated watercolor visualizer of the world's major worldviews, beginning with Christian theism and following the questions that lead away from it.">
<meta property="og:url" content="https://andresmessina-sdg.github.io/Worldviews-in-Motion/">
<meta property="og:image" content="https://andresmessina-sdg.github.io/Worldviews-in-Motion/preview.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="A watercolor of the triune God above the world. A red cross joins them, and man's sin is laid on it.">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='9' r='7' fill='%23e9b548'/%3E%3Ccircle cx='16' cy='23' r='7' fill='%233c9aa0'/%3E%3Cpath d='M16 12v9' stroke='%23a3262b' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Cormorant+SC:wght@600;700&family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..600,100;1,9..144,300..600,100&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=133">
<!-- the scripts js/main.js imports, asked for at once with it rather than only once it has arrived -->
<link rel="modulepreload" href="js/main.js?v=133">
<link rel="modulepreload" href="js/paint.js?v=133">
<link rel="modulepreload" href="js/worldviews.js?v=133">
<link rel="modulepreload" href="js/catalogue.js?v=133">
<link rel="modulepreload" href="js/menu.js?v=133">
<link rel="modulepreload" href="js/notes.js?v=133">
</head>
<!-- Until the first painting has been laid down, the page's words wait unseen (unpainted) and it takes no input
     (entering); until the sheet is first painted, the canvas is hidden (blank). js/main.js lifts all three. -->
<body class="unpainted entering blank">
<!-- While the scripts arrive: drops of the painting's three colours falling into a pool of water on the bare sheet. The
     first painting then flows out from the pool (see the entrance in js/main.js). -->
<div id="loading" role="status" aria-label="Loading"><div class="w">
  <div class="pool"><i></i><i></i><i></i></div>
  <p class="cap">Painting</p>
</div></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="ragged" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency=".05" numOctaves="3" seed="7"/><feDisplacementMap in="SourceGraphic" scale="9"/></filter>
  <filter id="ragged-drop" x="-15%" y="-15%" width="130%" height="130%"><feTurbulence type="fractalNoise" baseFrequency=".07" numOctaves="3" seed="3"/><feDisplacementMap in="SourceGraphic" scale="7"/></filter></svg>
<script>
  // (the caption in the language the page will open in, chosen as js/main.js chooses it)
  (function () {
    var q = new URLSearchParams(location.search).get('lang'), s = null;
    try { s = localStorage.getItem('lang'); } catch (e) {}
    var l = q === 'es' || q === 'en' ? q : s === 'es' || s === 'en' ? s : /^es\b/i.test(navigator.language || '') ? 'es' : 'en';
    if (l === 'es') { document.querySelector('#loading .cap').textContent = 'Pintando'; document.getElementById('loading').setAttribute('aria-label', 'Cargando'); }
  })();
</script>
<canvas id="c" aria-hidden="true"></canvas>
<svg id="conn" aria-hidden="true"></svg>
<svg id="lines" aria-hidden="true"></svg>

<div class="t">
  <div class="head">
    <p class="k">Worldviews in Motion</p>
    <h1 id="name"></h1>
    <p class="tag" id="tag"></p>
  </div>
  <div class="act" aria-live="polite"><h2 id="actName"></h2><p id="actText"></p><div id="moves"></div></div>
  <!-- for screen readers: what the painting's lettering says, which the eye reads off the painting itself -->
  <div id="scene" role="img"></div>
</div>

<!-- the question a move answers, set large while the shapes travel -->
<p id="ask" aria-hidden="true"></p>
<div id="labels"></div>
<nav id="menu" aria-label="Worldviews"></nav>
<nav id="marks" aria-label="The four acts"></nav>
<nav id="lang" aria-label="Language"></nav>
<p id="nogl" hidden>This painting needs WebGL, which your browser has switched off.</p>

<!-- The ?v= number here, on the stylesheet and on the preloads above matches the imports in js/main.js;
     raise them all together on each deploy, so no browser mixes new files with old cached ones. -->
<script type="module" src="js/main.js?v=133"></script>
</body>
</html>
