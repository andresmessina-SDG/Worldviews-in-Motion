<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Christian Theism · Worldviews in Motion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..600,100;1,9..144,300..600,100&display=swap" rel="stylesheet">
<style>
  :root { --ink: #2b211d; --red: #8f1d22; --title: 'Cormorant Garamond', Georgia, serif; --soft: 'Fraunces', 'Cormorant Garamond', Georgia, serif; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f6f1e7; color: var(--ink); font-family: var(--title); }
  canvas, svg#lines { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  svg#lines { pointer-events: none; }
  svg#lines path { fill: none; stroke: var(--ink); stroke-width: 1.2; stroke-linecap: round; opacity: .75; }
  svg#lines circle { fill: var(--ink); }
  svg#lines g { transition: opacity .5s ease; }

  .t { position: fixed; left: 8vw; top: 9vh; width: min(25vw, 21rem); }
  .t .k { margin: 0; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; font-size: .8rem; }
  .t h1 { margin: 2px 0 0; font-size: clamp(2rem, 5.5vmin, 3.6rem); font-weight: 600; line-height: 1; }
  .t .tag { margin: 8px 0 0; font-style: italic; font-weight: 600; font-size: clamp(1rem, 2.3vmin, 1.4rem); line-height: 1.15; }
  .act { margin-top: 3.2vh; padding-top: 2vh; border-top: 1.5px solid rgba(43,33,29,.35); transition: opacity .45s ease; }
  .act h2 { margin: 0; font-size: clamp(1.3rem, 3.2vmin, 2rem); font-weight: 600; color: var(--red); line-height: 1; }
  .act p { margin: 6px 0 0; font-size: clamp(1.05rem, 2.4vmin, 1.4rem); font-weight: 500; line-height: 1.22; }
  .swap .act { opacity: 0; }

  .l { position: fixed; left: 0; top: 0; font-family: var(--soft); font-variation-settings: 'SOFT' 100, 'WONK' 0; font-style: italic; font-weight: 400;
       font-size: clamp(1rem, 2.5vmin, 1.5rem); line-height: 1.08; white-space: nowrap; opacity: 0; transition: opacity .5s ease; will-change: transform; }
  .l small { display: block; font-size: .68em; font-weight: 400; opacity: .85; margin-top: 2px; }
  .l.center { text-align: center; }
  .l.right { text-align: right; }

  #marks button { position: fixed; transform: translate(-50%, -50%); border: 0; background: none; padding: 6px 8px; cursor: pointer;
       font-family: var(--soft); font-variation-settings: 'SOFT' 100, 'WONK' 0; font-size: clamp(.85rem, 2vmin, 1.15rem); font-weight: 400; color: var(--ink); opacity: .7; transition: opacity .3s, color .3s; white-space: nowrap; }
  #marks button:hover { opacity: 1; }
  #marks button[aria-current='true'] { opacity: 1; color: var(--red); font-weight: 600; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<svg id="lines"></svg>
<div class="t">
  <p class="k">Worldviews in Motion</p>
  <h1>Christian Theism</h1>
  <p class="tag">God made the world, and he came down to save it.</p>
  <div class="act"><h2 id="actName"></h2><p id="actText"></p></div>
</div>
<div id="labels"></div>
<div id="marks"></div>
<script type="module" src="christian.js"></script>
</body>
</html>
