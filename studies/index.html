<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Style studies · Worldviews in Motion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600;1,700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f6f1e7; font-family: 'Cormorant Garamond', Georgia, serif; color: #2b211d; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .t { position: fixed; left: 5vw; top: 5vh; }
  .t p { margin: 0; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; font-size: .8rem; opacity: .75; }
  .t h1 { margin: 2px 0 0; font-size: clamp(2rem, 5.5vmin, 3.6rem); font-weight: 600; line-height: 1; }
  .l { position: fixed; font-style: italic; font-weight: 700; font-size: clamp(.9rem, 2.1vmin, 1.3rem); transform: translate(-50%, -50%); white-space: nowrap; text-shadow: 0 0 8px rgba(250,245,235,.7); }
  .l.left { transform: translate(0, -50%); }
  .l.right { transform: translate(-100%, -50%); }
  nav { position: fixed; right: 5vw; top: 5vh; display: flex; gap: 8px; }
  nav a { font: inherit; font-weight: 700; font-style: italic; font-size: 1.05rem; color: inherit; text-decoration: none; padding: 4px 14px 6px; border: 1.5px solid currentColor; border-radius: 20px 16px 22px 15px; }
  nav a.on { background: #2b211d; color: #f6f1e7; border-color: #2b211d; }
  .l.light { color: #fbf4e2; text-shadow: 0 0 8px rgba(10,25,40,.85), 0 0 3px rgba(10,25,40,.8); }
  body.dark { color: #f7efdc; }
  body.dark .l { text-shadow: 0 0 10px rgba(10,12,30,.9), 0 0 3px rgba(10,12,30,.9); }
  body.dark nav a.on { background: #f7efdc; color: #1a1c38; border-color: #f7efdc; }
  body.frame .t { left: 8vw; top: 9vh; }
  body.frame nav { right: 8vw; top: 9vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="t"><p>Worldviews in Motion</p><h1>Christian Theism</h1></div>
<nav id="nav"></nav>
<div id="labels"></div>
<script type="module" src="study.js"></script>
</body>
</html>
